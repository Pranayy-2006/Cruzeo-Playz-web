<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cruzeo Playz — Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(0, 200, 255, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020812,
                    #061522,
                    #010509
                );

            color: white;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(0, 200, 255, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 200, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;
            pointer-events: none;
        }

        .login-box {
            position: relative;
            width: min(420px, 90%);

            padding: 42px 36px;

            background: rgba(5, 15, 27, 0.88);

            border: 1px solid rgba(0, 210, 255, 0.25);

            border-radius: 22px;

            box-shadow:
                0 0 60px rgba(0, 190, 255, 0.12),
                inset 0 0 30px rgba(0, 180, 255, 0.025);

            backdrop-filter: blur(18px);

            text-align: center;
        }

        .logo {
            width: 82px;
            height: 82px;

            object-fit: cover;

            border-radius: 18px;

            margin-bottom: 22px;

            border: 1px solid rgba(0, 220, 255, 0.4);

            box-shadow:
                0 0 25px rgba(0, 200, 255, 0.2);
        }

        .brand {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 2px;

            margin-bottom: 7px;
        }

        .brand span {
            color: #00d9ff;
        }

        .subtitle {
            color: #7e9aaa;
            font-size: 13px;

            margin-bottom: 32px;
        }

        .label {
            display: block;

            text-align: left;

            color: #8ea6b5;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 9px;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;

            padding: 15px 16px;

            border-radius: 12px;

            border: 1px solid rgba(0, 210, 255, 0.18);

            background: rgba(0, 0, 0, 0.35);

            color: white;

            outline: none;

            font-size: 15px;

            transition: 0.25s;
        }

        input:focus {
            border-color: #00d9ff;

            box-shadow:
                0 0 18px rgba(0, 210, 255, 0.12);
        }

        input::placeholder {
            color: #526875;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #00d9ff,
                    #0077ff
                );

            color: #001018;

            font-size: 14px;
            font-weight: 900;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(0, 180, 255, 0.25);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            min-height: 20px;

            margin-top: 16px;

            color: #ff6b6b;

            font-size: 13px;
        }

        .security {
            margin-top: 25px;

            color: #526875;

            font-size: 11px;

            letter-spacing: 0.5px;
        }

        .security span {
            color: #00d9ff;
        }

        .back {
            display: inline-block;

            margin-top: 22px;

            color: #68818f;

            text-decoration: none;

            font-size: 12px;

            transition: 0.2s;
        }

        .back:hover {
            color: #00d9ff;
        }

        @media (max-width: 480px) {

            .login-box {
                padding: 35px 24px;
            }

            .brand {
                font-size: 21px;
            }

        }
    </style>
</head>

<body>

    <div class="login-box">

        <img
            src="assets/images/logo.jpeg"
            alt="Cruzeo Playz"
            class="logo"
        >

        <div class="brand">
            CRUZEO <span>PLAYZ</span>
        </div>

        <div class="subtitle">
            Secure Admin Dashboard
        </div>

        <form id="loginForm">

            <label
                class="label"
                for="password"
            >
                ADMIN PASSWORD
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginButton"
            >
                LOGIN TO DASHBOARD
            </button>

        </form>

        <div
            class="error"
            id="errorMessage"
        ></div>

        <div class="security">
            🔒 <span>SECURE ACCESS</span> • ADMIN ONLY
        </div>

        <a
            href="/"
            class="back"
        >
            ← Back to Cruzeo Playz
        </a>

    </div>

    <script>

        // ==========================================
        // CHECK EXISTING LOGIN
        // ==========================================

        async function checkExistingLogin() {

            try {

                const response =
                    await fetch("/api/admin/auth");

                const data =
                    await response.json();

                if (data.authenticated) {

                    window.location.href =
                        "/admin.html";

                }

            } catch (error) {

                console.error(
                    "Auth check failed:",
                    error
                );

            }

        }

        checkExistingLogin();


        // ==========================================
        // LOGIN
        // ==========================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const button =
                        document
                            .getElementById("loginButton");

                    const errorMessage =
                        document
                            .getElementById("errorMessage");

                    errorMessage.textContent = "";

                    button.disabled = true;

                    button.textContent =
                        "AUTHENTICATING...";

                    try {

                        const response =
                            await fetch(
                                "/api/admin/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            password:
                                                password
                                        })
                                }
                            );

                        const data =
                            await response.json();

                        if (!response.ok) {

                            throw new Error(
                                data.message ||
                                "Login failed."
                            );

                        }

                        window.location.href =
                            "/admin.html";

                    } catch (error) {

                        errorMessage.textContent =
                            error.message;

                        button.disabled = false;

                        button.textContent =
                            "LOGIN TO DASHBOARD";

                    }

                }
            );

    </script>

</body>
</html>
